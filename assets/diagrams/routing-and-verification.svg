<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="810" viewBox="0 0 1120 810" role="img" aria-labelledby="title desc">
  <title id="title">Astral Orchestrator routing and verification workflow</title>
  <desc id="desc">A hand-drawn dark navy workflow from a request through Quick or Guided and Careful routes, ending in evidence-backed handoff.</desc>
  <defs>
    <marker id="gold-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 9 5 L 0 10" fill="none" stroke="#F2C86D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="lavender-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 9 5 L 0 10" fill="none" stroke="#C4B5FD" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.22"/></filter>
  </defs>
  <rect width="1120" height="810" rx="28" fill="#0B1020"/>
  <g fill="#F2C86D" opacity="0.8"><circle cx="74" cy="61" r="2.3"/><circle cx="1029" cy="81" r="2"/><circle cx="1002" cy="642" r="2.2"/><circle cx="111" cy="660" r="1.8"/></g>
  <g fill="#C4B5FD" opacity="0.7"><path d="M88 121l3 7 7 3-7 3-3 7-3-7-7-3 7-3z"/><path d="M1034 227l2 5 5 2-5 2-2 5-2-5-5-2 5-2z"/></g>
  <text x="560" y="48" fill="#F8F3E8" font-family="ui-rounded, system-ui, sans-serif" font-size="27" font-weight="700" text-anchor="middle">A calm route from request to checked handoff</text>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.4">
    <path d="M560 135 C558 151 561 163 560 177" stroke="#F2C86D" marker-end="url(#gold-arrow)"/>
    <path d="M502 232 C445 250 281 254 203 282" stroke="#F2C86D" marker-end="url(#gold-arrow)"/>
    <path d="M560 232 C560 250 560 265 560 282" stroke="#C4B5FD" marker-end="url(#lavender-arrow)"/>
    <path d="M203 370 C203 392 204 403 204 426" stroke="#F2C86D" marker-end="url(#gold-arrow)"/>
    <path d="M522 370 C486 390 457 402 446 426" stroke="#C4B5FD" marker-end="url(#lavender-arrow)"/>
    <path d="M598 370 C668 391 735 401 778 426" stroke="#C4B5FD" marker-end="url(#lavender-arrow)"/>
    <path d="M446 498 C474 523 499 533 520 550" stroke="#F2C86D" marker-end="url(#gold-arrow)"/>
    <path d="M778 498 C726 522 650 538 600 550" stroke="#F2C86D" marker-end="url(#gold-arrow)"/>
    <path id="quick-to-handoff" data-from="Sol primary + self-review" data-to="Evidence-backed handoff" d="M203 498 C203 625 314 747 431 764" stroke="#F2C86D" marker-end="url(#gold-arrow)"/>
    <path d="M560 610 C560 622 560 632 560 643" stroke="#C4B5FD" marker-end="url(#lavender-arrow)"/>
    <path d="M560 699 C560 713 560 723 560 736" stroke="#F2C86D" marker-end="url(#gold-arrow)"/>
  </g>
  <g opacity="0.42" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.1">
    <path d="M563 136 C561 154 564 164 563 178" stroke="#F2C86D"/><path d="M505 235 C430 253 280 258 205 285" stroke="#F2C86D"/><path d="M563 234 C563 250 564 266 563 283" stroke="#C4B5FD"/><path d="M206 372 C205 394 207 405 206 428" stroke="#F2C86D"/><path d="M525 373 C490 393 459 405 448 429" stroke="#C4B5FD"/><path d="M601 373 C671 394 739 404 780 429" stroke="#C4B5FD"/><path d="M449 500 C477 526 501 536 523 552" stroke="#F2C86D"/><path d="M781 500 C729 526 654 541 603 553" stroke="#F2C86D"/><path d="M206 500 C206 628 317 751 434 767" stroke="#F2C86D"/><path d="M563 701 C563 715 563 725 563 738" stroke="#F2C86D"/>
  </g>

  <g filter="url(#soft-shadow)" stroke-linejoin="round">
    <rect x="435" y="71" width="250" height="64" rx="17" fill="#16213E" stroke="#F2C86D" stroke-width="2.4"/>
    <ellipse cx="560" cy="204" rx="112" ry="38" fill="#222441" stroke="#C4B5FD" stroke-width="2.4"/>
    <rect x="70" y="282" width="266" height="88" rx="18" fill="#252B4A" stroke="#F2C86D" stroke-width="2.4"/>
    <rect x="70" y="426" width="266" height="72" rx="18" fill="#16213E" stroke="#F2C86D" stroke-width="2.4"/>
    <rect x="425" y="282" width="270" height="88" rx="18" fill="#252B4A" stroke="#C4B5FD" stroke-width="2.4"/>
    <rect x="343" y="426" width="206" height="72" rx="18" fill="#16213E" stroke="#C4B5FD" stroke-width="2.4"/>
    <rect x="671" y="426" width="272" height="72" rx="18" fill="#16213E" stroke="#C4B5FD" stroke-width="2.4"/>
    <rect x="435" y="550" width="250" height="60" rx="17" fill="#252B4A" stroke="#F2C86D" stroke-width="2.4"/>
    <rect x="435" y="643" width="250" height="56" rx="17" fill="#16213E" stroke="#C4B5FD" stroke-width="2.4"/>
    <rect x="435" y="736" width="250" height="56" rx="17" fill="#6B5B28" stroke="#F2C86D" stroke-width="2.4"/>
  </g>
  <g fill="#F8F3E8" font-family="ui-rounded, system-ui, sans-serif" text-anchor="middle">
    <text x="560" y="109" font-size="22" font-weight="700">Your request</text>
    <text x="560" y="211" font-size="21" font-weight="700">Choose mode</text>
    <text x="203" y="319" font-size="21" font-weight="700">Quick</text><text x="203" y="345" font-size="16">small, reversible</text>
    <text x="203" y="456" font-size="19" font-weight="700">Sol primary</text><text x="203" y="479" font-size="16">+ self-review</text>
    <text x="560" y="319" font-size="21" font-weight="700">Guided / Careful</text><text x="560" y="345" font-size="16">settle the plan</text>
    <text x="446" y="456" font-size="19" font-weight="700">Luna</text><text x="446" y="479" font-size="16">narrow work</text>
    <text x="807" y="456" font-size="19" font-weight="700">Terra</text><text x="807" y="479" font-size="16">context-heavy work</text>
    <text x="560" y="587" font-size="19" font-weight="700">Inspect + checks</text>
    <text x="560" y="677" font-size="18" font-weight="700">Fresh Sol review</text>
    <text x="560" y="770" font-size="18" font-weight="700">Evidence-backed handoff</text>
  </g>
  <g fill="#F2C86D" font-family="ui-rounded, system-ui, sans-serif" font-size="14" font-weight="700"><text x="299" y="255">do not delegate</text><text x="585" y="255">delegate bounded work</text></g>
</svg>
